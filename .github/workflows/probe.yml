# 一次性测试：GitHub 服务器能不能连上各个数据源。只打印结果，不改仓库。
name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        run: python scripts/probe.py
