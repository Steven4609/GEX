# GEX 小报：每个交易日盘后自动更新一次；网页上的“更新”按钮或 Actions 页面可随时手动运行。
# GitHub 的定时任务只认 UTC，而且常常延迟甚至漏掉，所以在美东傍晚到深夜之间排了 10 个时间点（每 30 分钟一次）：
#   UTC 22:10 – 02:40 = 冬令时 ET 17:10 – 21:40，夏令时 ET 18:10 – 22:40
# 脚本只在最近一个交易日收盘 1 小时 45 分之后、且它的盘后报告还没生成时才真正计算，所以每天只出一份；
# 其余时间点几秒钟就跳过。即使 GitHub 把任务拖到第二天凌晨，也会补上前一天的盘后报告。
name: GEX update

on:
  schedule:
    - cron: "10,40 22,23 * * 1-5"
    - cron: "10,40 0,1,2 * * 2-6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "自选股代码，逗号分隔（留空 = 不改；none = 清空）"
        required: false
        default: ""
      source:
        description: "期权数据源（cboe 优先，失败自动改用 yahoo）"
        type: choice
        options: [cboe, yahoo]
        default: cboe

permissions:
  contents: write

concurrency:
  group: gex-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 取运行开始时 main 的最新版本（不是触发时的版本），避免排队的任务用旧数据
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Compute and save (retries if main moved meanwhile)
        env:
          GEX_SOURCE: ${{ inputs.source || 'cboe' }}
          TICKERS: ${{ inputs.tickers }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ "$EVENT" = "schedule" ]; then
              python scripts/run.py --scheduled
            else
              python scripts/run.py --tickers "$TICKERS"
            fi
            git add -A data config
            if git diff --cached --quiet; then
              echo "没有新内容，不提交"; exit 0
            fi
            git commit -q -m "data: $(python -c "import json;d=json.load(open('data/latest.json'));print(d['generated'],d['mode'])" 2>/dev/null || echo update)"
            if git push -q origin HEAD:main; then
              echo "已保存（第 $attempt 次尝试）"; exit 0
            fi
            echo "推送时 main 已有新提交（可能同时有别的更新在跑），基于最新版本重新计算……"
            sleep $((attempt * 5))
          done
          echo "三次都没能保存"; exit 1
