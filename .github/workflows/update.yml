# GEX 小报：每个交易日盘后自动更新一次；网页上的“更新”按钮或 Actions 页面可随时手动运行。
# GitHub 的定时只认 UTC，写两个时间覆盖夏令时 / 冬令时：
#   22:10 UTC = 夏令时 18:10 ET；23:10 UTC = 冬令时 18:10 ET（夏令时时是 19:10）
# 脚本只在交易日 17:45 ET 之后、且当天还没有盘后报告时才真正计算，所以每天只出一份。
name: GEX update

on:
  schedule:
    - cron: "10 22 * * 1-5"
    - cron: "10 23 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "自选股代码，逗号分隔（留空 = 不改；none = 清空）"
        required: false
        default: ""
      source:
        description: "期权数据源（cboe 优先，失败自动改用 yahoo）"
        type: choice
        options: [cboe, yahoo]
        default: cboe

permissions:
  contents: write

concurrency:
  group: gex-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Compute GEX brief
        env:
          GEX_SOURCE: ${{ inputs.source || 'cboe' }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/run.py --scheduled
          else
            python scripts/run.py --tickers "$TICKERS"
          fi

      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data config
          if git diff --cached --quiet; then
            echo "没有新内容，不提交"
          else
            git commit -m "data: $(python -c "import json;d=json.load(open('data/latest.json'));print(d['generated'],d['mode'])" 2>/dev/null || echo update)"
            git pull --rebase --quiet || true
            git push
          fi
