<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEX 小报</title>
<style>
:root{--fg:#1a1a19;--mu:#6b6a65;--bd:rgba(0,0,0,.12);--bg:#f7f6f2;--cd:#fff;--tr:#eceae4;--up:#0f7a3d;--dn:#c0392b;--upb:#e5f4e4;--dnb:#fbebeb;--ac:#2f5d9e;--warn:#9a6700;--warnb:#fff6dd}
@media (prefers-color-scheme:dark){:root{--fg:#ecebe7;--mu:#a3a29c;--bd:rgba(255,255,255,.14);--bg:#1c1c1b;--cd:#262624;--tr:#3a3a37;--up:#4cc27a;--dn:#ef6b5e;--upb:#1d3a26;--dnb:#43201d;--ac:#7fa8e0;--warn:#e3b341;--warnb:#3a3016}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
.bar0{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-size:15px;font-weight:600;letter-spacing:.2px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:inherit;font-size:13px;color:var(--fg)}
button{background:var(--cd);border:.5px solid var(--bd);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--mu)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.55;cursor:default}
select,input{background:var(--cd);border:.5px solid var(--bd);border-radius:8px;padding:6px 8px}
.panel{background:var(--cd);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.6}
.panel h4{margin:0 0 6px;font-size:14px;font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2 input[type=text],.row2 input[type=password]{flex:1;min-width:200px}
.status{font-size:12px;color:var(--mu);min-height:18px;margin-top:6px}.status.err{color:var(--dn)}.status.ok{color:var(--up)}
.warn{background:var(--warnb);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0;line-height:1.6}
.hd{font-size:12px;color:var(--mu);margin:8px 0 4px}h1{font-size:19px;font-weight:600;margin:0 0 8px;line-height:1.4}
.ctx{font-size:13px;color:var(--mu);line-height:1.6;margin:0 0 12px}
.sec{font-size:13px;font-weight:600;color:var(--mu);margin:18px 0 8px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.c{background:var(--cd);border:.5px solid var(--bd);border-radius:12px;padding:14px 16px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.px{font-size:20px;font-weight:600}.chg{font-size:13px;margin-left:6px}
.badge{font-size:12px;padding:2px 9px;border-radius:6px;white-space:nowrap}.sub{font-size:12px;color:var(--mu);margin:4px 0 6px;line-height:1.6}
.walls{font-size:12px;margin:0 0 10px;line-height:1.6;color:var(--mu)}
.lvrow{border-top:.5px solid var(--bd);padding:9px 0 7px}.rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.lv{font-weight:600;white-space:nowrap}.tp{font-size:12px;color:var(--mu);text-align:right}.etf{font-size:12px;color:var(--mu);margin-top:2px}
.pr{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-top:5px}
.bar{height:6px;background:var(--tr);border-radius:3px;overflow:hidden}.bar span{display:block;height:100%;border-radius:3px}.pr b{font-weight:600;color:var(--fg);text-align:right}
.hit{font-size:12px;margin-top:5px}.aft{font-size:12px;color:var(--mu);margin-top:4px}
.omit{font-size:12px;color:var(--mu);border-top:.5px solid var(--bd);padding-top:8px;margin-top:2px;line-height:1.6}
.src{font-size:11px;color:var(--mu);margin-top:8px}
.ev{font-size:13px;line-height:1.7}.ev li{margin:2px 0}.ev a{color:var(--ac);text-decoration:none}
ul.notes{font-size:13px;margin:12px 0 0;padding-left:18px;line-height:1.7}
.ft{font-size:11px;color:var(--mu);margin-top:14px;line-height:1.6}
details{margin-top:8px}summary{cursor:pointer;font-size:12px;color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}th,td{padding:4px 6px;border-bottom:.5px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
.tblwrap{overflow-x:auto}
.empty{color:var(--mu);font-size:13px;padding:30px 0;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar0">
    <div class="brand" id="brand">GEX 小报</div>
    <div class="tools">
      <select id="hist" title=""></select>
      <button id="btnUpd" class="pri"></button>
      <button id="btnSet"></button>
      <button id="btnLang">EN</button>
    </div>
  </div>

  <div class="panel" id="watchPanel">
    <div class="row2">
      <label for="watchIn" id="watchLbl" style="font-weight:600"></label>
      <input type="text" id="watchIn" spellcheck="false" autocomplete="off">
    </div>
    <div class="status" id="st"></div>
  </div>

  <div class="panel hide" id="setPanel">
    <h4 id="setTitle"></h4>
    <div id="setHelp"></div>
    <div class="row2" style="margin-top:8px">
      <input type="password" id="tokIn" autocomplete="off" spellcheck="false">
      <button id="tokSave"></button><button id="tokDel"></button>
    </div>
    <div class="status" id="tokSt"></div>
  </div>

  <div id="main"><div class="empty" id="loading">…</div></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
let LANG = store.get('gex_lang') || 'zh';
let REPORT = null, INDEX = [];

// repo: https://<owner>.github.io/<repo>/
const OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : (store.get('gex_owner') || '');
const REPO = location.hostname.endsWith('.github.io') ? (location.pathname.split('/')[1] || '') : (store.get('gex_repo') || '');
const WORKFLOW = 'update.yml';

// ------------------------------------------------------------------ strings

    neg: '负伽马', pos: '正伽马', gapNone: '零伽马位不在 ±7% 内', gap: p => `离零伽马位 ${p}`, ma: (v, p) => `200 日线 $${v}（${p}）`, em: p => `预期波幅 ±${p}`, range: (l, h) => `日内 $${l}–${h}`,

    tags: {brokenPut: '已跌破的 Put 墙', brokenCall: '已升穿的 Call 墙', putWall: 'Put 墙', callWall: 'Call 墙', zero: '零伽马位', maxNeg: '最大负伽马行', neg: '负伽马行', pos: '正伽马行'},

    foot: '卡片只列碰到几率不低于 5%、或距离在预期波幅 2 倍以内的价位，每个方向至少保留最近的一个关键位。Call 墙为现价及上方 8% 内 call 伽马最大的行权价，Put 墙为现价及下方 8% 内 put 伽马最大的行权价；更大的墙已被突破且在 2 倍预期波幅内时，列为“已跌破 / 已升穿”的触发位。几率为随机游走基准（期权隐含波动率，按交易日折算，周末和假日不计），无方向预测力；“再次碰到”指从现价出发、收盘前再碰到该价位。杠杆 ETF 价只算 SPY / QQQ：盘后用其实际收盘价，其余时段按标的涨跌乘 3 推算，仅当日有效。符号按“做市商多 call、空 put”假设。不构成投资建议。',

    // update / settings

  const ev = eventsList(r);
  h += `<div class="sec">${t.events}</div><div class="c ev">${ev.length ? '<ul style="margin:0;padding-left:18px">' + ev.map(x => `<li>${x}</li>`).join('') + '</ul>' : `<span style="color:var(--mu)">${t.noEvents}</span>`}`;
  if (r.events && r.events.sources) h += `<div class="src">${esc(t.evSrc(Object.entries(r.events.sources).filter(([k]) => !k.endsWith('_err')).map(([, v]) => v).filter((v, i, a) => a.indexOf(v) === i).join(', ')))}</div>`;
  if (r.eventsError) h += `<div class="src" style="color:var(--dn)">${esc(r.eventsError)}</div>`;
  h += '</div>';
  const notes = notesList(r);
  if (notes.length) h += `<ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
  h += trackHtml(r);
  const srcs = [...new Set([...core, ...r.watch].map(a => a.src))].map(s => t.srcName[s] || s).join(' / ');
  h += `<div class="ft">${esc(t.foot)}<br>${esc(t.srcLine(srcs, core[0] ? core[0].ts : ''))} · ${esc(t.gen(r.generated, r.trigger))}</div>`;
  $('main').innerHTML = h;
}
function renderHist() {
  const t = T(), sel = $('hist'), cur = sel.value;
  sel.innerHTML = `<option value="">${t.latest}</option>` + INDEX.map(f => { const m = f.match(/^(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})-(\w+)\.json$/); return m ? `<option value="${f}">${+m[2]}/${+m[3]} ${m[4]}:${m[5]} ${t.modes[m[6]] || m[6]}</option>` : ''; }).join('');
  sel.value = cur;
}

// ------------------------------------------------------------------ data loading
const tok = () => store.get('gex_token');
async function loadJSON(path, viaApi) {
  if (viaApi && tok() && OWNER && REPO) {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, {headers: {Authorization: 'Bearer ' + tok(), Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
    if (r.ok) return r.json();
  }
  const r = await fetch(path + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load(file, viaApi) {
  try {
    const [rep, idx] = await Promise.all([loadJSON(file ? 'data/reports/' + file : 'data/latest.json', viaApi), loadJSON('data/index.json', viaApi).catch(() => INDEX)]);
    REPORT = rep; INDEX = idx || [];
    if (!file && document.activeElement !== $('watchIn')) $('watchIn').value = (rep.watchlist || []).join(', ');
    render();
  } catch (e) {
    REPORT = null; render();
    $('main').innerHTML = `<div class="empty">${esc(String(e).includes('404') ? T().noData : T().loadErr(e.message || e))}</div>`;
  }
}

// ------------------------------------------------------------------ manual update
const st = (msg, cls) => { $('st').className = 'status' + (cls ? ' ' + cls : ''); $('st').innerHTML = msg; };
const actionsUrl = () => OWNER && REPO ? `https://github.com/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}` : 'https://github.com';
async function gh(path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {...opt, headers: {Authorization: 'Bearer ' + tok(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {})}, cache: 'no-store'});
  if (!r.ok && r.status !== 204) { let m = r.status + ''; try { m += ' ' + (await r.json()).message; } catch (e) {} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}
async function update() {
  const t = T();
  if (!tok()) { st(`${esc(t.needTok)} <a href="${actionsUrl()}" target="_blank" rel="noopener" style="color:var(--ac)">${t.openActions}</a>`); $('setPanel').classList.remove('hide'); return; }
  $('btnUpd').disabled = true;
  const t0 = Date.now(), since = new Date(t0 - 15000).toISOString();
  try {
    await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {method: 'POST', body: JSON.stringify({ref: 'main', inputs: {tickers: $('watchIn').value.trim() || 'none'}})});
    st(esc(t.trig));
    let run = null;
    for (;;) {
      await new Promise(res => setTimeout(res, 6000));
      const sec = Math.round((Date.now() - t0) / 1000);
      if (sec > 600) { st(esc(t.timeout), 'err'); break; }
      const j = await gh(`/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5&created=>=${since}`);
      run = (j.workflow_runs || [])[0] || run;
      if (!run) { st(esc(t.trig)); continue; }
      if (run.status !== 'completed') { st(esc(t.running(sec))); continue; }
      if (run.conclusion === 'success') { $('hist').value = ''; await load('', true); st(esc(t.done), 'ok'); }
      else st(t.fail(`<a href="${run.html_url}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(run.conclusion)}</a>`), 'err');
      break;
    }
  } catch (e) { st(esc(t.trigErr(e.message || e)), 'err'); }
  $('btnUpd').disabled = false;
}

// ------------------------------------------------------------------ wiring
$('btnLang').onclick = () => { LANG = LANG === 'zh' ? 'en' : 'zh'; store.set('gex_lang', LANG); render(); };
$('btnSet').onclick = () => $('setPanel').classList.toggle('hide');
$('btnUpd').onclick = update;
$('watchIn').addEventListener('keydown', e => { if (e.key === 'Enter') update(); });
$('hist').onchange = () => load($('hist').value, false);
$('tokSave').onclick = async () => {
  const v = $('tokIn').value.trim(); if (!v) return;
  store.set('gex_token', v);
  try { await gh(''); $('tokSt').className = 'status ok'; $('tokSt').textContent = T().tokSaved; $('tokIn').value = ''; }
  catch (e) { store.set('gex_token', null); $('tokSt').className = 'status err'; $('tokSt').textContent = T().tokBad + '（' + e.message + '）'; }
};
$('tokDel').onclick = () => { store.set('gex_token', null); $('tokSt').className = 'status'; $('tokSt').textContent = T().tokDeleted; };
render();
load('', false);
</script>
</body>
